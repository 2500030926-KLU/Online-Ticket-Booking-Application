<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - TicketBook</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-page">

    <header class="navbar">

        <div class="nav-container">

            <a href="index.html" class="logo">
                🎟️ <span>TicketBook</span>
            </a>

            <a href="index.html" class="back-link">
                ← Back to Home
            </a>

        </div>

    </header>


    <main class="auth-wrapper">

        <div class="auth-card">

            <div class="auth-icon">
                👤
            </div>

            <h1>
                Create Account
            </h1>

            <p class="auth-description">
                Create your TicketBook account to start booking.
            </p>


            <form id="signupForm">

                <label for="signupName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Sai Venkat"
                    required
                >


                <label for="signupEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="example@gmail.com"
                    required
                >


                <label for="signupPhone">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="signupPhone"
                    placeholder="10-digit mobile number"
                    pattern="[0-9]{10}"
                    required
                >


                <label for="signupPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="primary-btn auth-button">

                    Create Account

                </button>

            </form>


            <p
                id="signupMessage"
                class="form-message">
            </p>


            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
