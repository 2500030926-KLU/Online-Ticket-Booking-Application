<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - TicketBook</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-page">

    <header class="navbar">

        <div class="nav-container">

            <a href="index.html" class="logo">
                🎟️ <span>TicketBook</span>
            </a>

            <a href="index.html" class="back-link">
                ← Back to Home
            </a>

        </div>

    </header>


    <main class="auth-wrapper">

        <div class="auth-card">

            <div class="auth-icon">
                🎟️
            </div>

            <h1>
                Welcome Back
            </h1>

            <p class="auth-description">
                Login to continue booking your movie tickets.
            </p>


            <form id="loginForm">

                <label for="loginEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="example@gmail.com"
                    required
                >


                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <button
                    type="submit"
                    class="primary-btn auth-button">

                    Login

                </button>

            </form>


            <p
                id="loginMessage"
                class="form-message">
            </p>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <p class="auth-switch">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
